name: etki-cephesi model testleri

on:
  push:
    paths:
      - "yayin/etki-cephesi-model.zip"
      - "etki_cephesi/**"
      - "akis_model.py"
      - "akis_model_ozeti.json"
      - "kalibre_matris.py"
      - "L_v2_2026-Q1.csv"
      - "G_v2_2026-Q1.csv"
      - ".github/workflows/etki-cephesi-model.yml"
  pull_request:
    paths:
      - "yayin/etki-cephesi-model.zip"
      - "etki_cephesi/**"
      - "akis_model.py"
      - "akis_model_ozeti.json"
      - "kalibre_matris.py"
      - "L_v2_2026-Q1.csv"
      - "G_v2_2026-Q1.csv"
      - ".github/workflows/etki-cephesi-model.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Bağımlılıklar
        run: pip install 'pytest==9.1.1' 'numpy==2.5.4' 'pandas==3.1.0'
      - name: geriye.json birebir
        run: |
          cp etki_cephesi/git-harm/data/geriye.json /tmp/geriye.json.once
          python3 etki_cephesi/git-harm/scripts/mfin_maliyet.py
          cmp /tmp/geriye.json.once etki_cephesi/git-harm/data/geriye.json
      - name: İşaret notu güncel
        run: |
          python3 etki_cephesi/git-harm/scripts/isaret_duyarlilik.py >/tmp/isaret.txt
          git diff --exit-code -- etki_cephesi/git-harm/ISARET_DUYARLILIK.md
      - name: Odak bölümü kaynakla aynı
        run: |
          python3 etki_cephesi/odak_israil_iran_misir/olustur.py
          git diff --exit-code -- etki_cephesi/odak_israil_iran_misir/odak_ulkeler.json etki_cephesi/odak_israil_iran_misir/README.md
          python3 -m pytest etki_cephesi/odak_israil_iran_misir/test_odak.py -q
      - name: Model testleri
        run: python3 etki_cephesi/run_model_tests.py
